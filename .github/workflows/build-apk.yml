name: Build APK

# 什么时候自动编译：
#   1) 推送到 main / master 分支
#   2) 打 v* 标签（会额外发布到 GitHub Release，方便直接下载）
#   3) 提交 Pull Request
#   4) 在 Actions 页面手动点 “Run workflow”
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

# 同一分支的旧任务自动取消，避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 与 app/build.gradle 里的 compileSdk / buildTools 保持一致
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 Debug APK（免签名，可直接安装）
        run: gradle :app:assembleDebug --stacktrace

      - name: 收集产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/jiehui-music-debug.apk
          ls -lh dist

      - name: 上传 APK（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: jiehui-music-debug
          path: dist/jiehui-music-debug.apk
          if-no-files-found: error
          retention-days: 90

      # =================================================================
      # 以下为「可选」的正式签名包。
      # 只有在仓库 Settings → Secrets and variables → Actions 里配置了
      # KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 这 4 个 Secret 时才会执行，否则自动跳过。
      # =================================================================

      - name: 写入签名文件
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks

      - name: 编译签名 Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE: ${{ github.workspace }}/signing/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk dist/jiehui-music-release.apk
          ls -lh dist

      - name: 上传签名包
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jiehui-music-release
          path: dist/jiehui-music-release.apk
          if-no-files-found: error

      # =================================================================
      # 打 tag（如 v1.0.0）时自动创建 Release，附上 APK 直链
      # =================================================================
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
